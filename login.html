<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin</title>
    <style>
        /* Nền cơ bản Trắng - Xanh Dương (White and Blue) */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #ffffff 50%, #bae6fd 100%);
            background-attachment: fixed;
            position: relative;
        }

        /* Nút quay lại trang chủ (Góc trên bên trái, màu xanh dương) */
        .btn-back {
            position: absolute;
            top: 25px;
            left: 25px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            color: #ffffff;
            background-color: #0284c7; /* Blue */
            border-radius: 6px;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
            transition: all 0.3s ease;
        }

        /* Hover của nút quay lại */
        .btn-back:hover {
            background-color: #0369a1; /* Blue đậm hơn */
            transform: translateY(-1px);
        }

        /* Hộp đăng nhập kính mờ bo góc 15px (Big Glass Box) */
        .login-box {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 15px; /* Bo góc 15 */
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(14, 165, 233, 0.15);
            text-align: center;
            box-sizing: border-box;
        }

        /* Tiêu đề H1 */
        h1 {
            font-size: 18px;
            color: #0369a1;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* Khu vực nhập liệu */
        .input-group {
            margin-bottom: 25px;
        }

        /* Ô nhập mật khẩu (Textbox) */
        .password-input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.8);
            color: #1e293b;
            outline: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
            background: #ffffff;
        }

        /* Nút bấm Login (Orange) */
        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-color: #ea580c; /* Cam đậm */
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.2);
        }

        /* Hover chuyển sang Cam dịu (Soft Orange) */
        .btn-login:hover {
            background-color: #ff7849; /* Soft Orange */
            box-shadow: 0 6px 20px rgba(255, 120, 73, 0.4);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <!-- Nút quay lại trang chủ -->
    <a href="index.html" class="btn-back">Quay lại trang chủ</a>

    <!-- Khối Box Đăng Nhập -->
    <div class="login-box">
        
        <h1>Chúng tôi không có dịch vụ đăng ký cho khách hàng, nếu bạn là admin, hãy nhập mật khẩu:</h1>
        
        <form id="loginForm">
            <div class="input-group">
                <input 
                    type="password" 
                    id="adminPassword"
                    class="password-input" 
                    placeholder="admin password" 
                    required
                >
            </div>
            
            <button type="submit" class="btn-login">Login</button>
        </form>

    </div>

    <!-- Xử lý logic kiểm tra mật khẩu bằng Javascript -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Chặn trang tải lại khi bấm nút

            const passwordInput = document.getElementById("adminPassword").value;

            // Kiểm tra điều kiện mật khẩu có trùng với "yenanh666" hay không
            if (passwordInput === "yenanh666") {
                window.location.href = "admin.html"; // Chuyển hướng tới trang admin.html
            } else {
                alert("Sai mật khẩu rồi bạn ơi! Vui lòng thử lại.");
            }
        });
    </script>

</body>
</html>
